name: 🐛 Bug Report
description: Report a bug or unexpected behavior in MailcowMobile
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: input
    id: version
    attributes:
      label: MailcowMobile Version
      description: Which version of MailcowMobile are you running? (check Settings or `package.json`)
      placeholder: "e.g. 0.0.1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (phone)
        - Android (tablet)
        - iOS (iPhone)
        - iOS (iPad)
        - Expo Go (development)
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS Version
      description: e.g. Android 14, iOS 17.4
      placeholder: "e.g. Android 14"
    validations:
      required: false

  - type: dropdown
    id: auth_method
    attributes:
      label: Authentication Method
      description: How are you logged in?
      options:
        - IMAP (password)
        - OAuth2 / SSO
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the app is affected?
      options:
        - Login / Authentication
        - Email — reading
        - Email — sending (SMTP)
        - Email — folders
        - Calendar — event display
        - Calendar — create/edit/delete event
        - Contacts — view
        - Contacts — create/edit/delete
        - Tasks — view
        - Tasks — create/edit/delete
        - Settings
        - Theme / UI
        - Push Notifications
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I tap … the app does … instead of …"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Open the app and log in
        2. Navigate to '…'
        3. Tap '…'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: If applicable, paste screenshots or a screen recording link.

  - type: textarea
    id: logs
    attributes:
      label: Console / Error Logs
      description: Paste any relevant errors from the Expo / Metro bundler console or device logs.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Anything else that might help us investigate (Mailcow version, server config, etc.)
